<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-SCIM | Building Scientific Minds</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    #original-site { display: block; width: 100%; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <!-- Keep the existing site design and add video behavior to its existing modals. -->
  <iframe id="original-site" src="B-SCIM_updated_sessions_team.html" title="B-SCIM website"></iframe>
  <script>
    const siteFrame = document.getElementById('original-site');

    function installVideoFeatures() {
      let site;
      try {
        site = siteFrame.contentWindow;
        if (!site || !site.document || !site.showCourseDetails || !site.openSession) return;
      } catch (error) {
        return;
      }

      const doc = site.document;
      if (doc.documentElement.dataset.videoFeaturesInstalled === 'true') return;
      doc.documentElement.dataset.videoFeaturesInstalled = 'true';

      const courseVideos = {
        'Professional English': [
          { title: 'السيشن 1', id: '1OBxgPy5ZuO5uY2Qfdtceie84pS5PEP1s' },
          { title: 'السيشن 2', id: '1tK-XWWp3TXrHXCo2mysb1RbbKCxfN8Go' },
          { title: 'السيشن 3', id: '1samiHybl8pm5M8KMOMYyhYMTyN8OWU4v' },
          { title: 'السيشن 4', id: '16oE29O94m0N8nv2o20RV8yL5kJZVy-CO' }
        ],
        'Microsoft Excel for Beginners': [
          { title: 'السيشن 1', soon: true },
          { title: 'السيشن 2', id: '1-R0u5YWEPuxFMOBbvYB2I2N3MfUTHdvh' },
          { title: 'السيشن 3', id: '1KnVDd5bMYFvZQ8zeB-z_XMIBVkzFnbTT' },
          { title: 'السيشن 4', id: '1Iu8a5qf36HJxk6kMpyLQGX_Rxyz4sbK2' }
        ],
        'Research & Analysis': [
          { title: 'السيشن 1', id: '1WlqgNT0Ci4Ejcl-wucllOp8ZtF1khl9e' },
          { title: 'السيشن 2', id: '1P3OWGkMLFnZf2SG8vvNtaeBZBnHICiXq' },
          { title: 'السيشن 3', id: '1cB6ytQLB1sdPkAriHV54IOt8nlUGRNRl' },
          { title: 'السيشن 4 — الجزء الأول', id: '1gVnn42LBwKaNzqE9OyhT_T5fM3QxkvQ0' },
          { title: 'السيشن 4 — الجزء الثاني', id: '1gVnn42LBwKaNzqE9OyhT_T5fM3QxkvQ0', note: 'رابط الجزء الثاني المرسل هو نفسه رابط الجزء الأول.' },
          { title: 'السيشن 5', id: '1KE6rUfyTSwwASz_AfZVAeXyIV6foaRoA' }
        ],
        'Graphic Design Fundamentals': [
          { title: 'السيشن 1', id: '1mXYYNbOmiJ-eIyI0Tl1OD1XOLwIidQRB' },
          { title: 'السيشن 2', soon: true },
          { title: 'السيشن 3', soon: true },
          { title: 'السيشن 4', id: '1UR0eUMdckbnfsuwz4z9jYmFRCNUjFiKB' },
          { title: 'السيشن 5', id: '1JirhIHtrN4jxSRfG6uCVZaNKc_F32xJb' }
        ]
      };

      function makePlayer(id, title) {
        const wrapper = doc.createElement('div');
        wrapper.className = 'bscim-inline-video';
        wrapper.style.cssText = 'display:none;margin-top:12px;';
        const frame = doc.createElement('iframe');
        frame.src = 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/preview';
        frame.title = title;
        frame.allow = 'autoplay; fullscreen';
        frame.allowFullscreen = true;
        frame.loading = 'lazy';
        frame.style.cssText = 'display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#102b42;';
        wrapper.appendChild(frame);
        return wrapper;
      }

      function addVideoButton(parent, video, courseName) {
        const button = doc.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-primary';
        button.textContent = 'مشاهدة الفيديو';
        button.style.cssText = 'display:block;margin-top:8px;';
        const player = makePlayer(video.id, courseName + ' — ' + video.title);
        button.addEventListener('click', function () {
          player.style.display = 'block';
          button.textContent = 'الفيديو بالأسفل';
        });
        parent.append(button, player);
      }

      const originalShowCourseDetails = site.showCourseDetails;
      site.showCourseDetails = function (courseName) {
        originalShowCourseDetails.call(site, courseName);
        const videos = courseVideos[courseName];
        const body = doc.getElementById('modalBody');
        if (!videos || !body) return;

        // The original modal lists session names at the top. Remove that list so each
        // session appears only once here, next to its video action.
        const originalSections = body.querySelectorAll('.modal-section');
        if (originalSections.length) originalSections[0].remove();

        const section = doc.createElement('div');
        section.className = 'modal-section';
        const heading = doc.createElement('h3');
        heading.textContent = '🎬 السيشنات';
        section.appendChild(heading);
        const list = doc.createElement('ul');
        list.style.cssText = 'list-style:none;padding:0;';

        videos.forEach(function (video) {
          const item = doc.createElement('li');
          item.style.cssText = 'padding:12px 16px;margin:10px 0;background:#ebf4fb;border-radius:8px;';
          const label = doc.createElement('strong');
          label.textContent = video.title;
          item.appendChild(label);

          if (video.soon) {
            const status = doc.createElement('span');
            status.textContent = ' — قريبًا';
            status.style.cssText = 'display:block;margin-top:6px;color:#5a7282;font-weight:700;';
            item.appendChild(status);
            const placeholder = doc.createElement('button');
            placeholder.type = 'button';
            placeholder.className = 'btn btn-primary';
            placeholder.textContent = 'مشاهدة الفيديو';
            placeholder.disabled = true;
            placeholder.setAttribute('aria-label', video.title + ' — الفيديو قريبًا');
            placeholder.style.cssText = 'display:block;margin-top:8px;opacity:.55;cursor:not-allowed;';
            item.appendChild(placeholder);
          } else {
            addVideoButton(item, video, courseName);
            if (video.note) {
              const note = doc.createElement('small');
              note.textContent = video.note;
              note.style.cssText = 'display:block;margin-top:8px;color:#5a7282;';
              item.appendChild(note);
            }
          }
          list.appendChild(item);
        });

        section.appendChild(list);
        body.appendChild(section);
      };

      const originalOpenSession = site.openSession;
      site.openSession = function (index) {
        originalOpenSession.call(site, index);
        const body = doc.getElementById('sessionModalBody');
        const cards = doc.querySelectorAll('#sessionsGrid .session-card');
        const sessionTitle = cards[index] && cards[index].querySelector('h3')
          ? cards[index].querySelector('h3').textContent.toLowerCase()
          : '';
        if (!body) return;

        let video = null;
        if (sessionTitle.includes('ai journey') || sessionTitle.includes('artificial intelligence') || sessionTitle.includes('ai engineer')) {
          video = { title: 'AI Journey', id: '191lFjaDUl8GClBEpjnnIwj4vCQmK70EE' };
        } else if (sessionTitle.includes('presentation')) {
          video = { title: 'Presentation Skills', id: '11Q2BSIEQqMQWTJB-NDhIEBorr6kpjHPN' };
        }
        if (!video) return;

        const block = doc.createElement('div');
        block.className = 'detail-block';
        const heading = doc.createElement('h3');
        heading.textContent = '🎬 مشاهدة الفيديو';
        const item = doc.createElement('div');
        item.style.cssText = 'padding:12px 16px;background:#ebf4fb;border-radius:8px;';
        const label = doc.createElement('strong');
        label.textContent = video.title;
        item.appendChild(label);
        addVideoButton(item, video, video.title);
        block.append(heading, item);
        body.appendChild(block);
      };

      const resizeFrame = function () {
        try {
          siteFrame.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
        } catch (error) { /* Keep current size if resizing is unavailable. */ }
      };
      resizeFrame();
      site.setTimeout(resizeFrame, 250);
      site.setTimeout(resizeFrame, 1000);
      if (site.ResizeObserver) new site.ResizeObserver(resizeFrame).observe(doc.documentElement);
    }

    siteFrame.addEventListener('load', installVideoFeatures);
  </script>
</body>
</html>
